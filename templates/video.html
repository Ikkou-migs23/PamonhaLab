{% extends "base.html" %}
{% block titulo %}Vídeos curtos · Pamonha Lab{% endblock %}
{% block conteudo %}
<main class="miolo estreito">
  <h1>Vídeos curtos</h1>
  <p class="sub">Envie um vídeo longo e receba um ZIP com vários cortes de duração fixa (MP4). Se sobrar um pedaço no final, ele vira o arquivo "sobra". Limite de 2 GB.</p>

  <form method="post" enctype="multipart/form-data" class="form">
    <label>Vídeo
      <input type="file" name="video" accept="video/*" required>
    </label>
    <label>Duração de cada corte (segundos)
      <input type="number" name="duracao" min="3" max="600" value="60" required>
    </label>
    <button class="botao" type="submit">Enviar e cortar</button>
  </form>
</main>
{% endblock %}
